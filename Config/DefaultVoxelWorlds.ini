; Redirects for names the code review's CR3 changed (CODE_REVIEW_PLAN.md §17, decision D-CR4), so assets and Blueprints
; saved with the old names load. The project's 25 world configurations were resaved with the new names; these can go
; a cycle after CR3 merges.
[CoreRedirects]
; Every world mode cuts the voxel window over to the far field (D38), not only planets (STREAM-26, CORE-29).
+PropertyRedirects=(OldName="/Script/VoxelCore.VoxelWorldConfiguration.PlanetVoxelCutoverAltitude",NewName="/Script/VoxelCore.VoxelWorldConfiguration.VoxelCutoverAltitude")
; The surface slab culls at every distance since D8, not only in the far bands (CORE-30).
+PropertyRedirects=(OldName="/Script/VoxelCore.VoxelWorldConfiguration.bFarBandSurfaceSlabCulling",NewName="/Script/VoxelCore.VoxelWorldConfiguration.bSurfaceSlabCulling")
; The chunk manager and the world actor return a spawn for every world mode, not only planets (CM-22).
+FunctionRedirects=(OldName="/Script/VoxelStreaming.VoxelChunkManager.GetPlanetSpawnPosition",NewName="/Script/VoxelStreaming.VoxelChunkManager.GetSpawnPosition")
+FunctionRedirects=(OldName="/Script/VoxelStreaming.VoxelWorldActor.GetPlanetSpawnPosition",NewName="/Script/VoxelStreaming.VoxelWorldActor.GetSpawnPosition")
